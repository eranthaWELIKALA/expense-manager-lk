name: Keep Supabase awake

# Free-plan Supabase projects pause after a week without requests. This sends one small
# database read twice a week. The tables are closed to the public key, so Postgres answers
# "permission denied" (HTTP 401), but the request still reaches the database.
# The run fails (and GitHub emails you) only when the project doesn't answer, e.g. it's paused.

on:
  schedule:
    - cron: "23 4 * * 1,4" # Mondays and Thursdays, 04:23 UTC
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Query the database through the REST API
        env:
          SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          SUPABASE_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
        run: |
          status=$(curl -sS -m 30 --retry 3 --retry-delay 10 -o /dev/null -w '%{http_code}' \
            -H "apikey: $SUPABASE_KEY" "$SUPABASE_URL/rest/v1/profiles?select=id&limit=1")
          echo "Supabase answered HTTP $status"
          test "$status" -lt 500
